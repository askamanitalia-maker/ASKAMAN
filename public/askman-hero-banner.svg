<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <!-- Clean subtle white/transparent background -->
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap");
      .brand-title {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 112px;
        font-weight: 900;
        letter-spacing: -2px;
      }
      .brand-tagline {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #0D131F;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <!-- Group: Official Attached Logo Symbol on Left -->
  <g transform="translate(60, 20) scale(0.64)">
    <!-- Main Speech Bubble with Profile Silhouette -->
    <path
      d="M 120 50
         C 80 50 50 80 50 120
         L 50 340
         C 50 380 80 410 120 410
         L 235 410
         L 200 480
         L 295 410
         L 330 410
         C 365 405 380 378 385 348
         C 390 338 402 332 418 324
         C 432 316 432 305 425 296
         C 416 290 410 284 410 277
         C 418 271 426 265 426 257
         C 420 251 410 247 410 241
         C 420 235 440 227 448 217
         C 453 211 449 204 440 201
         L 408 178
         C 403 167 407 151 413 137
         C 418 115 398 78 365 60
         C 340 48 310 48 280 50
         Z"
      fill="#0D131F"
    />

    <!-- Inner Bubble White Cavity -->
    <path
      d="M 120 86
         C 96 86 86 96 86 120
         L 86 340
         C 86 364 96 374 120 374
         L 308 374
         C 332 374 342 364 342 340
         L 342 120
         C 342 96 332 86 308 86
         Z"
      fill="#FFFFFF"
    />

    <!-- Question Mark -->
    <path
      d="M 166 174
         C 166 130 194 104 232 104
         C 270 104 298 130 298 168
         C 298 198 272 220 250 242
         L 250 268
         L 214 268
         L 214 234
         C 236 212 262 196 262 168
         C 262 146 248 133 232 133
         C 216 133 202 146 202 168
         Z"
      fill="#0D131F"
    />
    <circle cx="232" cy="316" r="20" fill="#0D131F" />
  </g>

  <!-- Brand Typography Lockup on Right -->
  <g transform="translate(410, 180)">
    <!-- Ask A Man text -->
    <text x="0" y="0" class="brand-title">
      <tspan fill="#0D131F">Ask</tspan>
      <tspan fill="#0D131F" dx="8">A</tspan>
      <tspan fill="#E07A5F" dx="8">Man</tspan>
    </text>

    <!-- Terracotta Accent Bar + Tagline -->
    <g transform="translate(0, 48)">
      <!-- Rounded Orange Bar -->
      <rect x="0" y="-18" width="76" height="10" rx="5" fill="#E07A5F" />
      <!-- Tagline -->
      <text x="96" y="-7" class="brand-tagline">il punto di vista maschile</text>
    </g>
  </g>
</svg>